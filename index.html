<style>
/* ── Full-bleed featured slider ── */
.featured {
  position: relative;
  width: 100%;
  height: 86vh;
  min-height: 560px;
  max-height: 960px;
  overflow: hidden;
  background: #0a0a14;
}
.slides-track {
  display: flex;
  width: 100%;
  height: 100%;
  will-change: transform;
}
.slide {
  position: relative;
  min-width: 100%;
  height: 100%;
  overflow: hidden;
  flex-shrink: 0;
}
.slide__bg {
  position: absolute; inset: 0;
  background-size: cover; background-position: center top;
  transform: scale(1.04);
  transition: transform 8s ease;
}
.slide.active .slide__bg { transform: scale(1.0); }
.slide__scrim {
  position: absolute; inset: 0;
  background:
    linear-gradient(180deg, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.0) 30%, rgba(0,0,0,0.75) 75%, rgba(0,0,0,0.92) 100%),
    linear-gradient(90deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.0) 55%);
}
.slide__content {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  padding: clamp(32px,5vw,72px) clamp(24px,6vw,96px) clamp(40px,6vh,80px);
  max-width: 900px;
  display: flex; flex-direction: column; gap: 16px;
  transform: translateY(20px); opacity: 0;
  transition: opacity 0.6s ease 0.3s, transform 0.6s ease 0.3s;
}
.slide.active .slide__content { transform: translateY(0); opacity: 1; }
.slide__eyebrow {
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.22em; text-transform: uppercase; color: #7dd3fc;
}
.slide__title {
  font-family: var(--font-display); font-weight: 900;
  font-size: 48px; line-height: 1.1;
  letter-spacing: 0.01em; color: #fff; margin: 0;
  text-shadow: 0 4px 48px rgba(0,0,0,0.5); text-wrap: balance;
}
@media (max-width: 600px) {
  .slide__title { font-size: 32px; }
}
.slide__tagline {
  color: rgba(255,255,255,0.72); font-size: clamp(15px,1.5vw,19px);
  margin: 0; max-width: 560px; line-height: 1.6;
}
.slide__ctas { display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap; }

/* Dots */
.slider-nav {
  position: absolute; bottom: clamp(28px,4vh,56px); right: clamp(24px,5vw,80px);
  display: flex; align-items: center; gap: 10px; z-index: 10;
}
.slider-dot {
  width: 36px; height: 3px; background: rgba(255,255,255,0.25);
  border: none; cursor: pointer; padding: 0;
  transition: background .3s, width .3s;
}
.slider-dot.active { background: #fff; width: 56px; }

/* Arrows */
.slider-arrow {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 52px; height: 52px; z-index: 10;
  border: 2px solid rgba(255,255,255,0.55);
  background: rgba(0,0,0,0.28);
  backdrop-filter: blur(8px);
  color: #fff; font-size: 22px; cursor: pointer;
  display: grid; place-items: center;
  border-radius: 2px; line-height: 1;
  transition: border-color .2s, background .2s, transform .15s;
}
.slider-arrow:hover { border-color: #fff; background: rgba(0,0,0,0.5); }
.slider-arrow--prev { left: 20px; }
.slider-arrow--next { right: 20px; }

/* Progress bar */
.slider-progress {
  position: absolute; bottom: 0; left: 0; height: 3px;
  background: var(--accent); transition: width 0.1s linear; z-index: 10;
}

/* Catalog */
.catalog {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap);
}

@media (max-width: 520px)  { .catalog { grid-template-columns: 1fr; } }

/* Studio statement */
.statement {
  display: grid; grid-template-columns: 1fr 2fr; gap: 48px;
  padding: 80px 0; border-top: 1px solid var(--line);
}
.statement h2 {
  font-family: var(--font-display); font-weight: 800;
  font-size: clamp(28px,3.5vw,48px); letter-spacing: 0.02em; line-height: 1.05; margin: 0;
}
.statement h2 em { font-style: normal; color: var(--accent); }
.statement p { color: var(--ink-dim); font-size: 17px; line-height: 1.7; margin: 0 0 20px; max-width: 720px; }
.statement__stats {
  display: grid; grid-template-columns: repeat(3,1fr); gap: 20px;
  margin-top: 32px; padding-top: 28px; border-top: 1px solid var(--line);
}
.stat b { display: block; font-family: var(--font-display); font-weight: 800; font-size: clamp(28px,3vw,44px); color: var(--ink); }
.stat span { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-muted); }
@media (max-width: 800px) { .statement { grid-template-columns: 1fr; gap: 24px; padding: 48px 0; } }

/* CTA Band */
.band {
  position: relative; overflow: hidden;
  padding: 80px var(--pad-x); margin-top: 40px;
  border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  background: radial-gradient(700px 400px at 90% 50%, rgba(2,132,199,0.08), transparent 70%), var(--bg-1);
}
.band__inner {
  max-width: 1560px; margin: 0 auto;
  display: flex; justify-content: space-between; align-items: center; gap: 32px; flex-wrap: wrap;
}
.band h3 { font-family: var(--font-display); font-weight: 800; font-size: clamp(24px,3vw,40px); letter-spacing: 0.01em; margin: 0; max-width: 720px; color: var(--ink); }
.band h3 em { font-style: normal; color: var(--accent); }
.band__meta { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-muted); margin-top: 10px; }
</style>

<script type="text/babel">
/* YSY Softworks — shared chrome components (React, inline JSX). */

/* ---------- Placeholder art generator ----------
   Real covers are hotlink-protected by Google Sites. We generate a styled
   SVG cover per game based on a hash of its slug, so imagery reads strong
   even when the real key art can't load. When a user drops real URLs in,
   the real image overlays on top automatically. */
function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
  return Math.abs(h);
}
const PALETTES = [
  ["#0c1a2e", "#0284c7", "#f59e0b"],  // sky blue→amber
  ["#0b1d3a", "#0ea5e9", "#bae6fd"],  // deep sky blue
  ["#3d0a1a", "#e11d48", "#fb923c"],  // crimson
  ["#0a2e2e", "#14b8a6", "#a7f3d0"],  // teal
  ["#2c1a00", "#d97706", "#fde68a"],  // amber
  ["#0a1a2e", "#38bdf8", "#f0f9ff"],  // light blue
  ["#0a1d1a", "#22c55e", "#facc15"],  // forest
  ["#0a1a2e", "#0369a1", "#7dd3fc"],  // deep blue
  ["#1a1a2e", "#0284c7", "#bae6fd"],  // blue
];
function placeholderSVG(title, slug, genre) {
  const h = hashStr(slug);
  const [c1, c2, c3] = PALETTES[h % PALETTES.length];
  const angle = (h % 180);
  const initials = title.replace(/[^A-Za-z ]/g,"").split(/\s+/)
    .map(w => w[0]).filter(Boolean).slice(0,3).join("").toUpperCase();
  const r1 = 20 + (h % 30);
  const r2 = 40 + ((h >> 3) % 40);
  const svg = `
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 600' preserveAspectRatio='xMidYMid slice'>
  <defs>
    <linearGradient id='g' x1='0' y1='0' x2='1' y2='1' gradientTransform='rotate(${angle} 0.5 0.5)'>
      <stop offset='0%' stop-color='${c1}'/>
      <stop offset='60%' stop-color='${c2}' stop-opacity='0.85'/>
      <stop offset='100%' stop-color='#07070c'/>
    </linearGradient>
    <radialGradient id='glow' cx='${30 + (h%40)}%' cy='${20 + (h%50)}%' r='60%'>
      <stop offset='0%' stop-color='${c3}' stop-opacity='0.55'/>
      <stop offset='60%' stop-color='${c3}' stop-opacity='0.0'/>
    </radialGradient>
    <pattern id='grid' width='40' height='40' patternUnits='userSpaceOnUse'>
      <path d='M 40 0 L 0 0 0 40' fill='none' stroke='rgba(255,255,255,0.04)' stroke-width='1'/>
    </pattern>
  </defs>
  <rect width='800' height='600' fill='url(#g)'/>
  <rect width='800' height='600' fill='url(#grid)'/>
  <circle cx='${620 - (h%200)}' cy='${180 + (h%120)}' r='${r2*3}' fill='${c3}' opacity='0.08'/>
  <circle cx='${200 + (h%180)}' cy='${420 + (h%60)}' r='${r1*3}' fill='${c2}' opacity='0.18'/>
  <rect width='800' height='600' fill='url(#glow)'/>
  <g opacity='0.12' transform='translate(${80 + (h%120)},${220 + (h%60)})'>
    <text x='0' y='0' font-family='Orbitron, sans-serif' font-weight='900' font-size='380' fill='${c3}'>${initials}</text>
  </g>
  <g transform='translate(48,500)'>
    <text font-family='JetBrains Mono, monospace' font-size='14' fill='rgba(255,255,255,0.6)' letter-spacing='2'>${(genre||"").toUpperCase()}</text>
    <text y='36' font-family='Orbitron, sans-serif' font-weight='800' font-size='32' fill='#fff' letter-spacing='1'>${title.replace(/—/g,"-").slice(0,28)}</text>
  </g>
  <rect x='0' y='580' width='800' height='20' fill='#07070c'/>
  <rect x='0' y='0' width='6' height='600' fill='${c3}' opacity='0.7'/>
</svg>`.trim();
  return `url("data:image/svg+xml;utf8,${encodeURIComponent(svg)}")`;
}

/* ---------- Tweaks (density) ---------- */
function Tweaks() {
  const [on, setOn] = React.useState(false);
  const [density, setDensity] = React.useState(() =>
    localStorage.getItem("ysy-density") || "default"
  );

  React.useEffect(() => {
    const root = document.documentElement;
    if (density === "default") root.removeAttribute("data-density");
    else root.setAttribute("data-density", density);
    localStorage.setItem("ysy-density", density);
  }, [density]);

  React.useEffect(() => {
    const handler = (e) => {
      if (!e.data) return;
      if (e.data.type === "__activate_edit_mode") setOn(true);
      if (e.data.type === "__deactivate_edit_mode") setOn(false);
    };
    window.addEventListener("message", handler);
    try { window.parent.postMessage({ type: "__edit_mode_available" }, "*"); } catch (_) {}
    return () => window.removeEventListener("message", handler);
  }, []);

  return (
    <div id="tweaks-panel" className={on ? "on" : ""}>
      <h5>Tweaks <span>/ density</span></h5>
      <div className="tw-row">
        {["compact","default","comfortable"].map(d => (
          <button
            key={d}
            className="tw-btn"
            data-on={density === d ? "1" : "0"}
            onClick={() => setDensity(d)}
          >{d}</button>
        ))}
      </div>
    </div>
  );
}

<script type="text/babel">

const games = window.YSY_GAMES;
const featured = games.filter((g) => g.featured).sort((a, b) => (a.featuredOrder || 99) - (b.featuredOrder || 99));
const INTERVAL = 8000;

const HIDDEN_FROM_HOME = new Set([
"insurgence-last-wishes",
"ruins-of-dawnseeker",
"insurgence-second-assault",
"fragmented-memories-arc-one",
"insurgence-chains-of-renegade"]
);

function FeaturedSlider() {
  const total = featured.length;
  const slides = [...featured, featured[0]]; // clone first for seamless loop
  const [idx, setIdx] = React.useState(0);
  const [animated, setAnimated] = React.useState(true);
  const [progress, setProgress] = React.useState(0);
  const timerRef = React.useRef(null);
  const startRef = React.useRef(null);
  const rafRef = React.useRef(null);

  const startTimer = React.useCallback(() => {
    if (timerRef.current) clearTimeout(timerRef.current);
    startRef.current = performance.now();
    setProgress(0);
    timerRef.current = setTimeout(() => {
      setAnimated(true);
      setIdx((i) => i + 1);
    }, INTERVAL);
  }, []);

  // Reset seamlessly when clone is reached
  React.useEffect(() => {
    if (idx === total) {
      const t = setTimeout(() => {
        setAnimated(false);
        setIdx(0);
        requestAnimationFrame(() => requestAnimationFrame(() => setAnimated(true)));
      }, 720);
      return () => clearTimeout(t);
    }
    startTimer();
    return () => clearTimeout(timerRef.current);
  }, [idx]);

  // Progress RAF
  React.useEffect(() => {
    cancelAnimationFrame(rafRef.current);
    const tick = (now) => {
      const elapsed = now - (startRef.current || now);
      setProgress(Math.min(elapsed / INTERVAL * 100, 100));
      rafRef.current = requestAnimationFrame(tick);
    };
    rafRef.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(rafRef.current);
  }, [idx]);

  const realIdx = idx % total;
  const goTo = (i) => {setAnimated(true);setIdx(i);};
  const prev = () => {if (idx > 0) goTo(idx - 1);};
  const next = () => goTo(idx + 1);

  return (
    <div className="featured" role="region" aria-label="Featured games">
      <div className="slides-track" style={{
        transform: `translateX(-${idx * 100}%)`,
        transition: animated ? 'transform 0.72s cubic-bezier(0.77,0,0.175,1)' : 'none'
      }}>
        {slides.map((g, i) =>
        <div key={g.slug + i} className={`slide${i === idx || idx === total && i === 0 ? ' active' : ''}`}>
            <div className="slide__bg" style={{ backgroundImage: coverBg(g) }} />
            <div className="slide__scrim" />
            <div className="slide__content">
              <span className="slide__eyebrow">{g.genre} · {g.status}</span>
              <h2 className="slide__title">{g.title}</h2>
              <p className="slide__tagline">{g.tagline} {g.description}</p>
              <div className="slide__ctas">
                <a className="btn btn--primary" href={`game.html?slug=${g.slug}`}>View game →</a>
                <a className="btn btn--ghost" href="https://store.steampowered.com/publisher/ysysoftworks" target="_blank" rel="noopener" style={{ color: '#fff', borderColor: 'rgba(255,255,255,0.35)' }}>Wishlist on Steam</a>
              </div>
            </div>
          </div>
        )}
      </div>

      <div className="slider-progress" style={{ width: `${progress}%` }} />

      <div className="slider-nav">
        {featured.map((_, i) =>
        <button key={i} className={`slider-dot${i === realIdx ? ' active' : ''}`}
        onClick={() => goTo(i)} aria-label={`Slide ${i + 1}`} />
        )}
      </div>

      <button className="slider-arrow slider-arrow--prev" onClick={prev} aria-label="Previous">&#8592;</button>
      <button className="slider-arrow slider-arrow--next" onClick={next} aria-label="Next">&#8594;</button>
    </div>);

}
