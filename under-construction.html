<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Under Construction — YSY Softworks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; background: #090c14; color: #f4f6fc; font-family: 'Plus Jakarta Sans', sans-serif; display: grid; grid-template-rows: auto 1fr auto; padding: clamp(24px, 5vw, 72px); background-image: radial-gradient(ellipse at 80% 20%, #27355055, transparent 55%); }
    header { font: 600 18px 'Sora', sans-serif; letter-spacing: -.5px; }
    header span { color: #8fafff; }
    main { width: 100%; max-width: 850px; margin: auto; padding: 80px 0; }
    .status { display: inline-flex; align-items: center; gap: 10px; color: #a9bfe9; font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }
    .status::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #9eb8ff; box-shadow: 0 0 20px #779cff88; }
    h1 { font: 600 clamp(40px, 7vw, 82px)/1.12 'Sora', sans-serif; letter-spacing: -.055em; margin: 28px 0; }
    p { max-width: 520px; color: #aeb7ca; font-size: clamp(16px, 2vw, 19px); line-height: 1.8; }
    nav { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 36px; }
    a { color: #f4f6fc; text-decoration: none; border: 1px solid #3a465d; border-radius: 6px; padding: 14px 22px; font-size: 14px; font-weight: 600; }
    a:first-child { background: #adc2ff; border-color: #adc2ff; color: #101827; }
    a:hover { filter: brightness(1.15); }
    a:focus-visible { outline: 3px solid #fff; outline-offset: 5px; }
    footer { color: #7f8ba3; font-size: 12px; border-top: 1px solid #253047; padding-top: 22px; }
  </style>
</head>
<body>
  <header>YSY <span>Softworks</span></header>
  <main>
    <div class="status">Under Construction</div>
    <h1>A new chapter<br>is on its way.</h1>
    <p>We're updating our website. While we work on the finishing touches, explore our games on Steam or get in touch with our team.</p>
    <nav aria-label="Stay connected">
      <a href="https://store.steampowered.com/publisher/ysysoftworks" target="_blank" rel="noopener noreferrer">Explore our games ↗</a>
      <a href="https://mail.google.com/mail/?view=cm&amp;fs=1&amp;to=ysysoftworks%40gmail.com" target="_blank" rel="noopener noreferrer">Contact us</a>
    </nav>
  </main>
  <footer>© YSY Softworks. Worlds to explore. Stories to remember.</footer>
</body>
</html>
